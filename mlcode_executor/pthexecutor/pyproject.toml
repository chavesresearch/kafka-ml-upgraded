[project]
name = "kafka-ml-pthexecutor"
version = "0.1.0"
# Matches the python:3.14-slim base image in Dockerfile.
requires-python = ">=3.14,<3.15"
dependencies = [
    "litestar==2.24.0",
    "multipart==2.0.0",
    "numpy==2.5.1",
    "pytorch-ignite==0.5.5",
    "torch==2.13.0",
    "torchinfo==1.8.0",
    "torchvision==0.28.0",
    "uvicorn[standard]==0.52.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
# CPU build, matching the default python:3.14-slim base image in
# Dockerfile. For GPU: switch Dockerfile's BASEIMG to a CUDA pytorch/pytorch
# image and drop this whole tool.uv section (plain PyPI already serves the
# CUDA-bundled torch/torchvision wheels under these same version numbers).
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
# Only used for packages that explicitly opt in via tool.uv.sources above
# (torch/torchvision) - without this, uv's dependency-confusion protection
# treats this as a general extra index and can resolve unrelated packages
# (e.g. numpy) against whatever version happens to be mirrored here instead
# of PyPI's latest.
explicit = true
