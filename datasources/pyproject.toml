[project]
name = "kafkaml-datasources"
version = "0.1.0"
description = "Kafka producer clients for streaming training/inference data to Apache Kafka for Kafka-ML"
requires-python = ">=3.9"
dependencies = [
    "fastavro==1.12.2",
    "kafka-python==3.0.10",
]

[dependency-groups]
# pytest==9.x dropped Python 3.9 support - this package's own
# requires-python floor (>=3.9) is a real compatibility promise to
# whatever Python version a client script installing this SDK happens to
# run, unlike the single-controlled-Docker-environment service projects
# elsewhere in this repo that already moved to pytest 9. Pinned to the
# latest 8.x release that still supports 3.9.
dev = [
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"
