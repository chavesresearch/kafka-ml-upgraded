<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Kafka-ML: connecting the data stream with ML/AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script src="/env.js"></script>
    <script>
      // Apply the stored (or OS-preferred) theme before first paint to avoid
      // a light->dark flash. Kept in sync with src/theme.ts.
      ;(function () {
        try {
          var stored = localStorage.getItem('kafkaml-theme')
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
