[project]
name = "kafka-ml-model-inference-pytorch"
version = "0.1.0"
# Matches the python:3.12-slim base image in Dockerfile (CPU build) - same
# pattern as model_training-upgraded/pytorch and
# mlcode_executor-litestar/pthexecutor.
requires-python = ">=3.12,<3.13"
dependencies = [
    "avro==1.12.1",
    "confluent-kafka==2.15.0",
    "numpy==2.5.1",
    "pytorch-ignite==0.5.5",
    "requests==2.32.5",
    "torch==2.13.0",
    "torchinfo==1.8.0",
    "torchvision==0.28.0",
]

[tool.uv.sources]
# CPU build, matching the default python:3.12-slim base image in
# Dockerfile - same pattern as model_training-upgraded/pytorch.
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
