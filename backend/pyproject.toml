[project]
name = "kafka-ml-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# sqlalchemy==2.0.36's typing internals (util/typing.py's make_union_type)
# raise `TypeError: descriptor '__getitem__' requires a 'typing.Union'
# object but received a 'tuple'` on Python 3.14 - hit during ORM model
# import (app/models.py's Mapped[...] annotations), not just under
# pytest, so this isn't a test-only issue - the app itself wouldn't boot.
# Confirmed empirically (a real `uv run pytest` collection failure, not
# assumed from changelogs) before reverting this pin. Revisit once
# SQLAlchemy ships a 3.14-compatible release (2.1 is still beta as of
# this check).
dependencies = [
    "aiokafka==0.14.0",
    "aiosqlite==0.22.1",
    "alembic==1.19.0",
    "greenlet==3.5.4",
    "httptools==0.8.0",
    "httpx==0.28.1",
    "kubernetes-asyncio==36.1.0",
    "litestar==2.24.0",
    "loguru==0.7.3",
    "msgspec==0.21.1",
    "paho-mqtt==2.1.0",
    "python-multipart==0.0.32",
    "sqlalchemy==2.0.36",
    "uvicorn==0.52.1",
    # web3==7.16.0 (bumped 2026-08-05 from 5.28.0, 3 majors behind - see
    # FUTURE.md Medium item 5). This dropped the whole
    # protobuf<4/setuptools<81/ipfshttpclient-prerelease/pytest_ethereum
    # dependency chain that used to force the workarounds this file and
    # model_training/tensorflow/pyproject.toml carried - confirmed
    # empirically (a real `uv sync` + `uv run pytest`, not assumed from
    # web3's changelog) that none of the old pins are needed with 7.x.
    # v6 renamed nearly every camelCase Eth JSON-RPC method to snake_case
    # (`toChecksumAddress`->`to_checksum_address`,
    # `getTransactionCount`->`get_transaction_count`, etc.) - updated in
    # app/blockchain.py. Contract *ABI* function names
    # (`contract.functions.saveTrainingSettings(...)` etc.) are unaffected -
    # those are Solidity function names from the deployed contract, not
    # web3.py API, and were never camelCase-normalized by web3.py itself.
    "web3==7.16.0",
    "wsproto==1.3.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
