[project]
name = "kafka-ml-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiokafka==0.12.0",
    "aiosqlite==0.20.0",
    "alembic==1.14.0",
    "greenlet==3.1.1",
    "httptools==0.6.4",
    "httpx==0.28.1",
    "kubernetes-asyncio==32.0.0",
    "litestar==2.14.0",
    "loguru==0.7.3",
    "msgspec==0.18.6",
    "paho-mqtt==2.1.0",
    "py-solc-x==2.0.2",
    "python-multipart==0.0.20",
    "sqlalchemy==2.0.36",
    "uvicorn==0.34.0",
    "web3==5.28.0",
    "wsproto==1.2.0",
]

[tool.uv]
# web3 (blockchain feature) depends on a pre-release build of
# ipfshttpclient - matches the --prerelease=allow flag the pip-based
# install used before.
prerelease = "allow"
