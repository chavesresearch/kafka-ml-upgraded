[project]
name = "kafkaml-client"
version = "0.1.0"
description = "A Python client for the Kafka-ML backend REST API - create models, configurations, deployments, and inferences from code instead of raw HTTP calls"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"
