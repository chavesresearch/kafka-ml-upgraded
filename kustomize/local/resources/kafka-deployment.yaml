apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    name: kafka
  name: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      name: kafka
  template:
    metadata:
      labels:
        name: kafka
      name: kafka
    spec:
      containers:
        - image: kafka
          name: kafka
          ports:
            - containerPort: 9092
            - containerPort: 9094
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,PLAINTEXT_HOST://:9094,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: CLUSTER_ID
              value: AwNMXPSeTT-BonNVOUvo5Q
            # Single-broker dev/local cluster: the internal offsets/transaction
            # topics default to replication.factor=3, which a 1-broker cluster
            # can never satisfy - auto-creating them then fails with
            # INVALID_REPLICATION_FACTOR, and any consumer group join (every
            # service here uses one - kafka_control_logger, model_training,
            # mlcode_executor's tfexecutor) hangs forever with no error at all.
            # Verified hitting exactly this while building the images this
            # deployment runs (see mlcode_executor/CLAUDE.md and
            # datasources/CLAUDE.md) before adding these three.
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
