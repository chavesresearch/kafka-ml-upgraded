# Wallet key for CASE=9 (blockchain-traced federated learning) against the
# local Anvil devnet (blockchain-devnet.yaml) - Anvil's own well-known
# default dev account #0 private key, not a real secret (anyone running
# this locally gets the exact same funded account, by design - see
# blockchain-devnet.yaml's own comment). Safe to commit for that reason.
# A real deployment creates this Secret out-of-band instead, exactly like
# kafkaml-kube-credentials (see backend-deployment.yaml's own comment) -
# never put a real wallet key directly in a kustomize resource.
apiVersion: v1
kind: Secret
metadata:
  name: kafkaml-blockchain-credentials
type: Opaque
stringData:
  wallet-key: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
