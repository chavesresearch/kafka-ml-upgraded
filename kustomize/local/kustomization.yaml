resources:
  - resources/namespace.yaml
  - resources/kafka-deployment.yaml
  - resources/kafka-service.yaml
  - "../v1.0"

namespace: kafkaml

configMapGenerator:
  - name: kafkaml-configmap
    behavior: merge
    literals:
      - brokers=kafka:9092
      # Locally-built training/inference images (see the `images:` block
      # below for the executor/backend/frontend equivalents) - dynamically
      # created Jobs (job_manifest_generator.py) read these via
      # TENSORFLOW_TRAINING_MODEL_IMAGE etc. env vars, hardcoded to
      # imagePullPolicy: Always, but Docker Desktop's Kubernetes shares the
      # same local image cache `docker build` writes to, so an unqualified
      # `name:tag` still resolves without a real registry - verified
      # empirically by actually running training Jobs against these tags,
      # not assumed from imagePullPolicy semantics alone.
      - tensorflow.training.image=kafka-ml-model-training-tensorflow:test
      - tensorflow.inference.image=kafka-ml-model-inference-tensorflow:test
      - pytorch.training.image=kafka-ml-model-training-pytorch:test
      - pytorch.inference.image=kafka-ml-model-inference-pytorch:test
images:
  - name: kafka
    newName: docker.io/apache/kafka
    newTag: "4.3.1"
  # Locally-built images from this session's Litestar/uv rewrite - not
  # published anywhere, only present in the local Docker image cache (this
  # cluster is Docker Desktop's own Kubernetes, which shares that cache -
  # no registry push or `minikube image load` needed). See the
  # imagePullPolicy patches below: without them, the base Deployments'
  # `imagePullPolicy: Always` would try and fail to pull these from a
  # registry that doesn't have them.
  #
  # NB: these `name:` values match what ../v1.0's own `images:` transformer
  # already renamed the base's `kafka-ml-*` placeholders to
  # (`ertis/kafka-ml-*:v1.0`) - kustomize's image transformer matches
  # against the *current* name in the resource tree, not the original base
  # name, so overriding an already-remapped nested kustomization means
  # matching its output, not the placeholder.
  - name: ertis/kafka-ml-backend
    newName: kafka-ml-backend
    newTag: "test"
  - name: ertis/kafka-ml-frontend
    newName: kafka-ml-frontend
    newTag: "test"
  - name: ertis/kafka-ml-kafka_control_logger
    newName: kafka-ml-control-logger
    newTag: "test"
  - name: ertis/kafka-ml-tfexecutor
    newName: kafka-ml-tfexecutor
    newTag: "test"
  - name: ertis/kafka-ml-pthexecutor
    newName: kafka-ml-pthexecutor
    newTag: "test"

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: kafka-control-logger
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: tfexecutor
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: pthexecutor
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
