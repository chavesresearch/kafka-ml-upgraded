apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    name: backend
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      name: pod-backend
  template:
    metadata:
      labels:
        name: pod-backend
      name: backend
    spec:
      serviceAccountName: kafkaml
      automountServiceAccountToken: true
      containers:
        - image: kafka-ml-backend
          name: backend
          ports:
            - containerPort: 8000
          imagePullPolicy: Always
          env:
            - name: BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: kafkaml-configmap
                  key: brokers
            - name: CONTROL_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: kafkaml-configmap
                  key: control.topic
            - name: KUBE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TENSORFLOW_TRAINING_MODEL_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: kafkaml-configmap
                  key: tensorflow.training.image
            - name: TENSORFLOW_INFERENCE_MODEL_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: kafkaml-configmap
                  key: tensorflow.inference.image
            - name: PYTORCH_TRAINING_MODEL_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: kafkaml-configmap
                  key: pytorch.training.image
            - name: PYTORCH_INFERENCE_MODEL_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: kafkaml-configmap
                  key: pytorch.inference.image
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: kafkaml-configmap
                  key: frontend.url
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: kafkaml-configmap
                  key: backend.url
            - name: TFEXECUTOR_URL
              valueFrom:
                configMapKeyRef:
                  name: kafkaml-configmap
                  key: tfexecutor.url
            - name: PTHEXECUTOR_URL
              valueFrom:
                configMapKeyRef:
                  name: kafkaml-configmap
                  key: pthexecutor.url
            - name: ALLOWED_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: kafkaml-configmap
                  key: backend.allowedhosts
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: kafkaml-configmap
                  key: debug
                  optional: true
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: kafkaml-configmap
                  key: environment
                  optional: true
            - name: MODEL_LOGGER_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: kafkaml-configmap
                  key: federated.modelloggertopic
                  optional: true
            - name: ENABLE_FEDML_BLOCKCHAIN
              valueFrom:
                configMapKeyRef:
                  name: kafkaml-configmap
                  key: fedml.blockchain.enable
                  optional: true
            - name: FEDML_BLOCKCHAIN_RPC_URL
              valueFrom:
                configMapKeyRef:
                  name: kafkaml-configmap
                  key: fedml.blockchain.rpc-url
                  optional: true
            - name: FEDML_BLOCKCHAIN_CHAIN_ID
              valueFrom:
                configMapKeyRef:
                  name: kafkaml-configmap
                  key: fedml.blockchain.chain-id
                  optional: true
            - name: FEDML_BLOCKCHAIN_NETWORK_ID
              valueFrom:
                configMapKeyRef:
                  name: kafkaml-configmap
                  key: fedml.blockchain.network-id
                  optional: true
            - name: FEDML_BLOCKCHAIN_WALLET_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: kafkaml-configmap
                  key: fedml.blockchain.wallet-address
                  optional: true
            - name: FEDML_BLOCKCHAIN_WALLET_KEY
              valueFrom:
                configMapKeyRef:
                  name: kafkaml-configmap
                  key: fedml.blockchain.wallet-key
                  optional: true
            - name: FEDML_BLOCKCHAIN_BLOCKSCOUT_URL
              valueFrom:
                configMapKeyRef:
                  name: kafkaml-configmap
                  key: fedml.blockchain.blockscout-url
                  optional: true            
            - name: FEDML_BLOCKCHAIN_TOKEN_NAME
              valueFrom:
                configMapKeyRef:
                  name: kafkaml-configmap
                  key: fedml.blockchain.token-name
                  optional: true
            - name: FEDML_BLOCKCHAIN_TOKEN_SYMBOL
              valueFrom:
                configMapKeyRef:
                  name: kafkaml-configmap
                  key: fedml.blockchain.token-symbol
                  optional: true

          # Optional default credentials for deploying models/inferences to
          # an *external* Kubernetes cluster - used only as a fallback when
          # a request doesn't supply its own `token`/`external_host` (see
          # app/controllers/deployments.py and inferences.py). `optional:
          # true` means these are inert until the Secret actually exists,
          # so it's safe to leave this block uncommented. Create the Secret
          # out-of-band, e.g.:
          #   kubectl create secret generic kafkaml-kube-credentials \
          #     -n kafkaml --from-literal=token=... --from-literal=host=https://...
          # Never put the token/host value directly in this file (not even
          # commented out) - anything committed here ends up in git history.
            - name: KUBE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kafkaml-kube-credentials
                  key: token
                  optional: true
            - name: KUBE_HOST
              valueFrom:
                secretKeyRef:
                  name: kafkaml-kube-credentials
                  key: host
                  optional: true
