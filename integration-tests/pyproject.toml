[project]
name = "kafka-ml-integration-tests"
version = "0.1.0"
description = "Real API-driven integration tests for Kafka-ML: create model/configuration/deployment via the backend's REST API, send real Kafka data, poll for a real training/inference result."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "kafka-python==3.0.10",
    "kafkaml-client",
    "kafkaml-datasources",
    "numpy==2.5.1",
    "pytest==9.1.1",
]

[tool.uv.sources]
kafkaml-client = { path = "../kafkaml-client", editable = true }
kafkaml-datasources = { path = "../datasources", editable = true }
