[project]
name = "kafka-ml-model-training-pytorch"
version = "0.1.0"
# Matches the python:3.14-slim base image in Dockerfile (CPU build) - see
# mlcode_executor/pthexecutor/pyproject.toml for the same pattern.
requires-python = ">=3.14,<3.15"
dependencies = [
    "avro==1.12.1",
    "kafka-python==3.0.10",
    "numpy==2.5.1",
    "pytorch-ignite==0.5.5",
    "requests==2.34.2",
    "scikit-learn==1.9.0",
    "seaborn==0.13.2",
    "torch==2.13.0",
    "torchinfo==1.8.0",
    "torchvision==0.28.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
# CPU build, matching the default python:3.14-slim base image in
# Dockerfile. For GPU: switch Dockerfile's BASEIMG to a CUDA pytorch/pytorch
# image and drop this whole tool.uv section (plain PyPI already serves the
# CUDA-bundled torch/torchvision wheels under these same version numbers) -
# same pattern as mlcode_executor/pthexecutor.
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
# explicit = true scopes this index to only torch/torchvision (via
# tool.uv.sources above) - without it, uv's dependency-confusion
# protection still treats this as a general fallback index and can
# resolve unrelated packages against whatever happens to be mirrored here.
explicit = true
