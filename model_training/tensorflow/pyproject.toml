[project]
name = "kafka-ml-model-training-tensorflow"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "confluent-kafka==2.15.0",
    "fastavro==1.12.2",
    "kafka-python==3.0.10",
    "matplotlib==3.11.1",
    "numpy==2.4.6",
    "requests==2.34.2",
    "scikit-learn==1.9.0",
    "seaborn==0.13.2",
    "tensorflow==2.21.0",
    "tf-kafka-dataset",
    # web3==7.16.0 (bumped 2026-08-05 from 5.28.0 - see
    # ../../backend/pyproject.toml's comment and FUTURE.md Medium item 5
    # for the full reasoning). Dropped the setuptools<81/protobuf-override/
    # prerelease-allow/pytest_ethereum workarounds this pin used to need -
    # confirmed empirically that a plain `uv lock` resolves protobuf to the
    # same 7.35.1 tensorflow==2.21.0 already needs, with zero override.
    # Camel-case Eth JSON-RPC method renames (v6) applied in
    # blockchain_utils.py/blockchainSingleFederatedTraining.py - contract
    # ABI function names (`contract.functions.saveTrainingSettings(...)`
    # etc.) are unaffected, those come from the deployed Solidity contract,
    # not web3.py's own API.
    "web3==7.16.0",
]

[tool.uv.sources]
# Local sibling package - the tensorflow-io-replacement Kafka dataset
# helpers (get_bounded_kafka_dataset/get_streaming_kafka_batches) were
# extracted out to ../../tf-kafka-dataset since they're generically useful
# (not Kafka-ML-specific) and are now shared with
# federated-module/federated_model_training/tensorflow instead of
# being duplicated in both places.
tf-kafka-dataset = { path = "../../tf-kafka-dataset" }

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
