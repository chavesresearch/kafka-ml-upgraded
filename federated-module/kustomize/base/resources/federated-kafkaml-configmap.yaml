apiVersion: v1
kind: ConfigMap
metadata:
  name: federated-kafkaml-configmap
data:
  federated.data.control.topic: FEDERATED_DATA_CONTROL_TOPIC
  federated.model.control.topic: FEDERATED_MODEL_CONTROL_TOPIC
  federated.backend.url: federated-backend:8085
  backend.allowedhosts: 127.0.0.1,localhost,federated-backend
  
  # kml.cloud.brokers: cloud-kafka-broker:9092
  # federated.data.brokers: data-kafka-broker:9092
  # debug: "0"
  
  # Blockchain configuration
  fedml.blockchain.wallet-address: "0x0"
  # wallet-key deliberately not here - it's a private key, not config. See
  # federated-backend-deployment.yaml's FEDML_BLOCKCHAIN_WALLET_KEY env
  # (secretKeyRef against kafkaml-blockchain-credentials, the same Secret
  # the main kustomize/base/resources/backend-deployment.yaml uses - both
  # deploy into the same kafkaml namespace) for where it comes from instead.