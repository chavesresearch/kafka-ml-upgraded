[project]
name = "kafka-ml-federated-model-training-tensorflow"
version = "0.1.0"
# Matches the Python version tensorflow/tensorflow:2.21.0 actually ships
# (confirmed by running it) - same pairing as
# model_training/tensorflow.
requires-python = ">=3.11,<3.12"
dependencies = [
    "confluent-kafka==2.15.0",
    "fastavro==1.12.2",
    "kafka-python==3.0.10",
    "numpy==2.4.6",
    "tensorflow==2.21.0",
    "tf-kafka-dataset",
    # web3==7.16.0 (bumped 2026-08-05 from 5.28.0) - see
    # ../../../model_training/tensorflow/pyproject.toml's comment for the
    # full reasoning (dropped setuptools<81/protobuf-override/
    # prerelease-allow/pytest_ethereum, all confirmed unnecessary with 7.x).
    # Camel-case Eth JSON-RPC renames applied in
    # federated_blockchainSingleClassicTraining.py.
    "web3==7.16.0",
]

[tool.uv.sources]
# Same shared package as model_training/tensorflow - see that
# pyproject.toml's comment.
tf-kafka-dataset = { path = "../../../tf-kafka-dataset" }

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
