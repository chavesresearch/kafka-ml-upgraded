[project]
name = "kafka-ml-federated-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "confluent-kafka==2.15.0",
    "django==6.0.8",
    "django-cors-headers==4.9.0",
    "django-model-utils==5.0.0",
    "djangorestframework==3.17.2",
    "gunicorn==26.0.0",
    "kubernetes==36.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.12.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "autoweb.settings"
pythonpath = ["."]
