on:
  push:
    paths:
      - frontend/**/*
    branches:
      - "master"
      - "main"
      - "latest"
      - "dev*"
  pull_request:
    paths:
      - frontend/**/*
  release:
    types:
      - created
  workflow_dispatch:

# See backend.yml's identical block for why this is needed - without it,
# calling build.yml below fails at startup (repo default token is
# read-only; a reusable workflow can't be granted more than its caller has).
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm run test:run
      - name: Build
        run: pnpm run build

  build-frontend:
    needs: test
    # Only publish an image from pushes/releases, never from a PR.
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build.yml
    with:
      context: frontend
      dockerfile: frontend/Dockerfile
      name: kafka-ml-frontend
      platforms: linux/amd64
    secrets: inherit
