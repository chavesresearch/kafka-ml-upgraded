on:
  push:
    paths:
      - mlcode_executor/tfexecutor/**/*
    branches:
      - "master"
      - "main"
      - "latest"
      - "dev*"
  pull_request:
    paths:
      - mlcode_executor/tfexecutor/**/*
  release:
    types:
      - created
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mlcode_executor/tfexecutor
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.9.x"
      - name: Run tests
        run: uv run pytest -v

  build-tfexecutor:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - name: kafka-ml-tfexecutor
          - name: kafka-ml-tfexecutor-gpu
            build-args: "TFTAG=2.21.0-gpu"
    uses: ./.github/workflows/build.yml
    with:
      context: mlcode_executor/tfexecutor
      dockerfile: mlcode_executor/tfexecutor/Dockerfile
      name: ${{ matrix.name }}
      platforms: linux/amd64
      build-args: ${{ matrix.build-args }}
    secrets: inherit
