on:
  push:
    paths:
      - model_inference/pytorch/**/*
    branches:
      - "master"
      - "main"
      - "latest"
      - "dev*"
  pull_request:
    paths:
      - model_inference/pytorch/**/*
  release:
    types:
      - created
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model_inference/pytorch
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.9.x"
      - name: Run tests
        run: uv run pytest -v

  build-pth-model-inference:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - name: kafka-ml-pytorch_model_inference
          - name: kafka-ml-pytorch_model_inference-gpu
            build-args: "BASEIMG=pytorch/pytorch:2.13.0-cuda12.6-cudnn9-runtime"
    uses: ./.github/workflows/build.yml
    with:
      context: model_inference/pytorch
      dockerfile: model_inference/pytorch/Dockerfile
      name: ${{ matrix.name }}
      platforms: linux/amd64
      build-args: ${{ matrix.build-args }}
    secrets: inherit
