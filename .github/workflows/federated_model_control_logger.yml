on:
  push:
    paths:
      - federated-module/federated_model_control_logger/**/*
    branches:
      - "master"
      - "main"
      - "latest"
      - "dev*"
  release:
    types:
      - created
  workflow_dispatch:

# See backend.yml's identical block for why this is needed - without it,
# calling build.yml below fails at startup (repo default token is
# read-only; a reusable workflow can't be granted more than its caller has).
permissions:
  contents: read
  packages: write

jobs:
  build-federated-model-control-logger:
    uses: ./.github/workflows/build.yml
    with:
      context: federated-module/federated_model_control_logger
      dockerfile: federated-module/federated_model_control_logger/Dockerfile
      name: federated-kafka-ml-model_control_logger
      platforms: linux/amd64
    secrets: inherit
