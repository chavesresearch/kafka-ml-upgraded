on:
  push:
    paths:
      - backend/**/*
    branches:
      - "master"
      - "main"
      - "latest"
      - "dev*"
  pull_request:
    paths:
      - backend/**/*
  release:
    types:
      - created
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.9.x"
      - name: Run tests
        run: uv run pytest -v

  build-backend:
    needs: test
    # Only publish an image from pushes/releases, never from a PR.
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build.yml
    with:
      context: backend
      dockerfile: backend/Dockerfile
      name: kafka-ml-backend
      platforms: linux/amd64
    secrets: inherit
