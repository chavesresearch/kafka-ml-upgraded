on:
  push:
    paths:
      - mlcode_executor/pthexecutor/**/*
    branches:
      - "master"
      - "main"
      - "latest"
      - "dev*"
  pull_request:
    paths:
      - mlcode_executor/pthexecutor/**/*
  release:
    types:
      - created
  workflow_dispatch:

# See backend.yml's identical block for why this is needed - without it,
# calling build.yml below fails at startup (repo default token is
# read-only; a reusable workflow can't be granted more than its caller has).
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mlcode_executor/pthexecutor
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.x"
      - name: Run tests
        run: uv run pytest -v

  build-pthexecutor:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - name: kafka-ml-pthexecutor
          - name: kafka-ml-pthexecutor-gpu
            # TORCH_VARIANT=gpu makes the Dockerfile reinstall torch/
            # torchvision from a CUDA-bundled build after uv sync - without
            # it, uv.lock's own pytorch-cpu-index resolution wins regardless
            # of BASEIMG, and this image silently ships CPU-only torch on a
            # CUDA base (see the Dockerfile's own comment on this step).
            build-args: |
              BASEIMG=pytorch/pytorch:2.13.0-cuda12.6-cudnn9-runtime
              TORCH_VARIANT=gpu
    uses: ./.github/workflows/build.yml
    with:
      context: mlcode_executor/pthexecutor
      dockerfile: mlcode_executor/pthexecutor/Dockerfile
      name: ${{ matrix.name }}
      platforms: linux/amd64
      build-args: ${{ matrix.build-args }}
    secrets: inherit
