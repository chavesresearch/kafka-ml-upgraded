on:
  push:
    paths:
      - model_training/tensorflow/**/*
      - tf-kafka-dataset/**/*
    branches:
      - "master"
      - "main"
      - "latest"
      - "dev*"
  pull_request:
    paths:
      - model_training/tensorflow/**/*
      - tf-kafka-dataset/**/*
  release:
    types:
      - created
  workflow_dispatch:

# See backend.yml's identical block for why this is needed - without it,
# calling build.yml below fails at startup (repo default token is
# read-only; a reusable workflow can't be granted more than its caller has).
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model_training/tensorflow
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.9.x"
      - name: Run tests
        run: uv run pytest -v

  build-tf-model-training:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - name: kafka-ml-tensorflow_model_training
          - name: kafka-ml-tensorflow_model_training-gpu
            build-args: "TFTAG=2.21.0-gpu"
    uses: ./.github/workflows/build.yml
    with:
      # Must be the repo root, not model_training/tensorflow - the
      # Dockerfile COPYs the sibling tf-kafka-dataset package into the
      # image (see its own header comment) and a subdirectory build
      # context can't reach outside itself. Reproduced the failure with a
      # real `docker build` before fixing this - previously-uncaught since
      # this workflow had never actually been triggered.
      context: .
      dockerfile: model_training/tensorflow/Dockerfile
      name: ${{ matrix.name }}
      platforms: linux/amd64
      build-args: ${{ matrix.build-args }}
    secrets: inherit
