on:
  push:
    paths:
      - federated-module/federated_backend/**/*
    branches:
      - "master"
      - "main"
      - "latest"
      - "dev*"
  pull_request:
    paths:
      - federated-module/federated_backend/**/*
  release:
    types:
      - created
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: federated-module/federated_backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.9.x"
      - name: Run tests
        run: uv run pytest -v

  build-federated-backend:
    needs: test
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build.yml
    with:
      context: federated-module/federated_backend
      dockerfile: federated-module/federated_backend/Dockerfile
      name: federated-kafka-ml-backend
      platforms: linux/amd64
    secrets: inherit
