on:
  push:
    paths:
      - federated-module/federated_backend/**/*
    branches:
      - "master"
      - "main"
      - "latest"
      - "dev*"
  pull_request:
    paths:
      - federated-module/federated_backend/**/*
  release:
    types:
      - created
  workflow_dispatch:

# See backend.yml's identical block for why this is needed - without it,
# calling build.yml below fails at startup (repo default token is
# read-only; a reusable workflow can't be granted more than its caller has).
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: federated-module/federated_backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.x"
      - name: Run tests
        run: uv run pytest -v

  build-federated-backend:
    needs: test
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build.yml
    with:
      context: federated-module/federated_backend
      dockerfile: federated-module/federated_backend/Dockerfile
      name: federated-kafka-ml-backend
      platforms: linux/amd64
    secrets: inherit
