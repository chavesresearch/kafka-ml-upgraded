on:
  push:
    paths:
      - model_training/pytorch/**/*
    branches:
      - "master"
      - "main"
      - "latest"
      - "dev*"
  pull_request:
    paths:
      - model_training/pytorch/**/*
  release:
    types:
      - created
  workflow_dispatch:

# See backend.yml's identical block for why this is needed - without it,
# calling build.yml below fails at startup (repo default token is
# read-only; a reusable workflow can't be granted more than its caller has).
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model_training/pytorch
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.9.x"
      - name: Run tests
        run: uv run pytest -v

  build-pth-model-training:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - name: kafka-ml-pytorch_model_training
          - name: kafka-ml-pytorch_model_training-gpu
            build-args: "BASEIMG=pytorch/pytorch:2.13.0-cuda12.6-cudnn9-runtime"
    uses: ./.github/workflows/build.yml
    with:
      context: model_training/pytorch
      dockerfile: model_training/pytorch/Dockerfile
      name: ${{ matrix.name }}
      platforms: linux/amd64
      build-args: ${{ matrix.build-args }}
    secrets: inherit
